packages:
  - 'packages/*'

# Pacotes autorizados a rodar script de build na instalação.
#
# O pnpm 10+ NÃO roda script de dependência por default (supply chain: um `postinstall`
# malicioso executa com a permissão de quem instala). Sem esta lista, `pnpm install` num
# ambiente limpo aborta com ERR_PNPM_IGNORED_BUILDS.
#
# `esbuild` precisa do script: ele instala o binário nativo da plataforma. É dependência
# transitiva do vitest e do tsx — ferramenta de desenvolvimento, não vai para a imagem final.
#
# CORRIGIDO EM M10: havia aqui uma chave `allowBuilds:` com o valor literal
# "set this to true or false" — placeholder de template commitado desde o M0 (e1a42dd) e nunca
# preenchido. A chave sequer existe no pnpm. Só se manifestou quando o primeiro `docker build`
# do projeto rodou num ambiente sem `node_modules` pré-aprovado.
onlyBuiltDependencies:
  - esbuild

# NÃO aborta o install quando um script de dependência é ignorado.
#
# O que isto NÃO faz: não afrouxa a proteção de supply chain. Quem decide QUAIS pacotes
# podem executar script continua sendo `onlyBuiltDependencies` acima — `strictDepBuilds`
# só governa se um script IGNORADO derruba o install inteiro.
#
# Por que é necessário: no pnpm 11.1.0 o `esbuild` aparece em três versões transitivas
# (0.18.20, 0.25.12, 0.28.1, via vitest/tsx/eslint) e continua sendo reportado como
# ignorado mesmo constando em `onlyBuiltDependencies` — verificado com
# `pnpm config get onlyBuiltDependencies`, que devolve `["esbuild"]` e ainda assim aborta.
# O efeito era travar `pnpm install --frozen-lockfile` em TODO ambiente limpo: o CI e o
# `docker build`.
#
# Por que é seguro: o esbuild não precisa do script. Ele distribui o binário em pacotes
# de plataforma (`@esbuild/linux-x64`); o `postinstall` apenas valida. Provado em container
# limpo antes de adotar — install, build e a suíte de testes completa passam sem ele.
strictDepBuilds: false
