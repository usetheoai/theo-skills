findings:
  - id: F-arch-1
    severity: HIGH
    file: packages/api/src/server/handlers/skills.ts
    line: 320
    plan_ref: T4.1 (Files to edit + Acceptance Criteria), Objective sub-goal 3, ADR D1 table
    summary: >
      A listagem GET /v1/skills — o outro caminho de DESCOBERTA — não aplica o filtro de ciclo
      de vida. Rascunhos e deprecadas continuam visíveis por ali, sem opt-in.
    evidence: |
      ```ts
      // packages/api/src/server/handlers/skills.ts:320-326
      app.get('/v1/skills', async (c) => {
        const page = await deps.skillsStoreFor(workspaceOf(c)).listPaginated(pageSize, pageToken);
        return c.json({ skills: page.skills, next_page_token: page.nextPageToken }, 200);
      });
      ```
      `grep -rn lifecycle packages/api/src` devolve apenas `retrieve.ts:69,89`, `app.ts:27` e o
      próprio `handlers/lifecycle.ts`. `packages/api/src/server/store/skills-store.ts` NÃO foi
      tocado neste range (git diff --stat 3b85e5f..HEAD), logo `listPaginated` não recebe
      `LifecycleVisibility` nem projeta a coluna.
      O plano é explícito — T4.1 título: "`:retrieve` e `GET /v1/skills` aceitam as três flags";
      a tabela do ADR D1 diz "Aparece na busca? não (opt-in)" para `draft` e `deprecated`.
    recommended_action: >
      Estender `SkillsStore.listPaginated(pageSize, pageToken, visibility)` e traduzir a
      especificação com o MESMO `buildLifecycleClause` (ou equivalente Drizzle), com as três
      flags parseadas no handler pelo `RetrieveParamsSchema`/`BooleanFlagSchema` já existente.
      Cobrir com o teste que percorre a tabela de D1 na listagem, não só no :retrieve.

  - id: F-arch-2
    severity: HIGH
    file: packages/api/src/server/store/skills-store.ts
    line: 113
    plan_ref: T5.1 Acceptance Criteria ("Os dois campos chegam ao contrato de leitura (aditivos)"), Coverage Matrix linha 6
    summary: >
      `lifecycle`, `deprecation_reason` e `superseded_by` são escritos pelo PUT mas nenhum
      caminho de leitura os expõe — colunas cegas para o consumidor.
    evidence: |
      ```ts
      // packages/api/src/server/store/skills-store.ts:113-125 — toView()
      function toView(row: {
        skillId; name; description; state; latestRevisionId;
        category?; execution?; visibility; embedded; createTime; updateTime;
      }): SkillView   // <- sem lifecycle / deprecationReason / supersededBy
      ```
      `GET /v1/skills/:id` (skills.ts:329-335) devolve exatamente esse `SkillView`.
      O teste que o plano nomeia `reason_and_successor_reach_the_read_contract()` foi escrito
      contra o BANCO, não contra o contrato:
      ```ts
      // packages/api/tests/integration/m32-lifecycle-operation.integration.test.ts:101
      'SELECT lifecycle, deprecation_reason, superseded_by FROM skills WHERE ...'
      ```
      Consequência declarada no próprio plano (Coverage Matrix linha 6): sem esses campos no
      contrato de leitura, a tela do M33 não tem o que dizer sobre "o que deixa de valer".
    recommended_action: >
      Acrescentar os três campos (aditivos, opcionais) a `liveColumns`/`toView`/`SkillView` e ao
      contrato Zod de leitura, e reescrever `reason_and_successor_reach_the_read_contract` para
      asseverar via `GET /v1/skills/:id` — um teste que consulta o banco não prova contrato.

  - id: F-arch-3
    severity: MEDIUM
    file: packages/core/src/domain/retrievers/lifecycle-clause.ts
    line: 21
    plan_ref: T3.1 Files to edit (`skills-store.ts`), ADR D3
    summary: >
      O ponto único de tradução migrou de `skills-store.ts` (onde o plano o colocou) para
      `domain/retrievers/`, sem ADR registrando a mudança — e é essa migração silenciosa que
      deixou a listagem de fora (F-arch-1).
    evidence: |
      Plano T3.1 § Files to edit:
      ```
      packages/api/src/server/store/skills-store.ts — aplica o predicado nas consultas de busca/listagem
      ```
      Implementado em `packages/core/src/domain/retrievers/lifecycle-clause.ts` e consumido só por
      `keyword-retriever.ts:36` e `vector-retriever.ts:54`. `skills-store.ts` ficou intocado.
      A escolha é defensável para o `:retrieve` (que passa pelos retrievers, não pelo store), mas
      o plano assumia um único ponto cobrindo "busca/listagem" — e a listagem vive no store.
    recommended_action: >
      Registrar a divergência como ADR no plano (por que o retriever, e não o store) e declarar
      explicitamente que a listagem exige um segundo ponto de tradução — ou unificar os dois
      caminhos atrás de uma única porta de descoberta.

  - id: F-arch-4
    severity: MEDIUM
    file: packages/core/src/domain/retrievers/lifecycle-clause.ts
    line: 28
    plan_ref: ADR D3 ("uma função pura buildLifecycleFilter(opts) no domínio devolve a especificação")
    summary: >
      O default seguro da descoberta está codificado em DOIS lugares — DRY sobre conhecimento de
      negócio, não sobre linhas.
    evidence: |
      ```ts
      // lifecycle-clause.ts:28
      const spec: LifecycleVisibility = visibility ?? { stages: ['active'], requireEnabled: true };
      ```
      ```ts
      // skill-lifecycle.ts:86-90 — a MESMA regra, já expressa
      export function buildLifecycleFilter(opts = {}): LifecycleVisibility {
        const stages: SkillLifecycle[] = ['active'];
        ...
        return { stages, requireEnabled: !opts.includeDisabled };
      }
      ```
      Se o default mudar no domínio (ex.: passar a esconder também um estágio novo), o fallback
      da cláusula discorda em silêncio — e a discordância aparece como skill visível que deveria
      estar escondida, sem erro algum.
    recommended_action: "Trocar o literal por `visibility ?? buildLifecycleFilter()`."

  - id: F-arch-5
    severity: MEDIUM
    file: packages/core/src/domain/skill-lifecycle.ts
    line: 55
    plan_ref: T1.1 (o plano especifica apenas union + parseLifecycle + InvalidLifecycleError)
    summary: >
      `isValidLifecycle` é export órfão (consumido só pelo próprio teste) e usa exceção como
      controle de fluxo.
    evidence: |
      ```ts
      export function isValidLifecycle(value: string): boolean {
        try { parseLifecycle(value); return true; } catch { return false; }
      }
      ```
      `grep -rn isValidLifecycle packages/ --include=*.ts` → apenas a definição, o `dist/` e
      `skill-lifecycle.test.ts:6,51,53,54`. Nenhum caller de produção.
      Dois desvios: `rules/error-handling.md` § 2 — "Never use exceptions for control flow";
      `rules/parsimony-ladder.md` rung 1 — o símbolo não precisa existir (o plano não o pediu).
      É também candidato a `dead_code_unallowlisted_typescript` no `/code-quality`.
    recommended_action: >
      Remover. Se um caller real aparecer, implementar como
      `SKILL_LIFECYCLES.includes(value.trim().toLowerCase())` — sem try/catch.

  - id: F-arch-6
    severity: LOW
    file: packages/api/src/server/app.ts
    line: 27
    plan_ref: Global Definition of Done ("`pnpm lint` sem avisos")
    summary: "Import de `registerLifecycleRoutes` fora da ordem alfabética — dispara `import/order` (warn)."
    evidence: |
      ```ts
      import { registerSkillsRoutes } from './handlers/skills.js';
      import { registerVersionRoutes } from './handlers/version.js';
      import { registerLifecycleRoutes } from './handlers/lifecycle.js';   // 'l' depois de 'v'
      import { registerVisibilityRoutes } from './handlers/visibility.js';
      ```
      `eslint.config.ts:22-25` → `'import/order': ['warn', { alphabetize: { order: 'asc' } }]`.
      Severidade LOW porque é `warn`, não `error` — mas a DoD do plano exige lint SEM avisos.
    recommended_action: "Mover o import para depois de `./handlers/instructions*`/antes de `./handlers/members*`, conforme a ordem asc."

  - id: F-arch-7
    severity: INFO
    file: packages/core/src/domain/skill-lifecycle.ts
    line: 1
    plan_ref: T1.1 Acceptance Criteria ("Sem import de `infrastructure/` nem de HTTP no arquivo"), rules/architecture.md § 2
    summary: "DIP verificado e respeitado — o módulo de domínio não importa NADA; a direção infra→domínio é a única presente."
    evidence: |
      `grep -n '^import' packages/core/src/domain/skill-lifecycle.ts` → zero linhas. Sem Drizzle,
      sem `pg`, sem Hono, sem Zod (o plano permitia Zod; o autor foi mais restritivo, e melhor).
      A direção permitida aparece invertida corretamente do outro lado:
      ```ts
      // packages/core/src/infrastructure/db/schema.ts:17 — infra depende do domínio (permitido)
      import { SKILL_LIFECYCLES } from '../../domain/skill-lifecycle.js';
      lifecycle: text('lifecycle', { enum: SKILL_LIFECYCLES }).notNull().default('active'),
      ```
      O vocabulário tem fonte única — o erro que o plano diz estar pagando (`state: text()` com
      lista duplicada) não se repete. ADRs D1, D4 e D5 respeitados na implementação: três eixos
      separados, validação de valor sem máquina de transição, CHECK constraint escrito à mão na
      migração 0014 (que o Drizzle não geraria).
    recommended_action: "Nenhuma ação. Manter a ausência de imports como invariante do arquivo."

  - id: F-arch-8
    severity: LOW
    file: packages/core/src/domain/retrievers/lifecycle-clause.ts
    line: 35
    plan_ref: rules/architecture.md § 1 ("Domain knows nothing about HTTP, ORMs...") e § 6 (leaky abstractions)
    summary: >
      O domínio emite fragmento de SQL literal. É extensão de precedente já estabelecido no repo,
      não defeito novo — registrado para não passar como aprovado sem exame.
    evidence: |
      ```ts
      return ` AND ${clauses.join(' AND ')}`;   // dialeto SQL dentro de domain/
      ```
      Precedente pré-existente: `keyword-retriever.ts` e `vector-retriever.ts` já compõem SQL em
      `domain/retrievers/`, contra a porta `QueryExecutor` (`types.ts:90`). O acoplamento está
      contido — os valores passam por `ParamBuilder.bind()` (`$N`), nunca interpolados, então não
      há superfície de injeção. `hybrid-retriever.ts:137` repassa `...params` por inteiro, o que
      corrige por construção o defeito de "enumerar campos" que o próprio comentário documenta.
    recommended_action: >
      Nenhuma mudança neste milestone (seria refactor fora de escopo). Se o repo quiser fechar a
      fronteira, o caminho é uma AST/spec de predicado no domínio traduzida por um adaptador em
      `infrastructure/` — decisão de ADR próprio, não deste plano.
