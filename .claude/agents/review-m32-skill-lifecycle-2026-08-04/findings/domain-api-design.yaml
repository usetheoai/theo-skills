    plan_ref: "T5.1 — validação da sucessora"
    domain_anchor: "packages/api/src/server/store/skills-store.ts:100-103 — 'a união minhas + públicas', a mesma cláusula da busca"
    summary: >
      A busca da sucessora filtra só por `workspaceId` do ator, enquanto todo o modelo de LEITURA
      deste registro (`getView`, `getInstructions`, `:retrieve`, `provenance`) opera sobre a união
