        or(eq(skills.workspaceId, workspaceId), eq(skills.visibility, 'public'))
    recommended_action: >
      Decidir explicitamente: ou alinhar o predicado à união `minhas + públicas` (coerente com o
      que o ponteiro precisa poder resolver), ou registrar em comentário/ADR que a sucessora é
