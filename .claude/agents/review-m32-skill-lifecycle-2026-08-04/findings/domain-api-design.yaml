  - id: F-dom-5
    severity: LOW
    file: packages/api/src/server/handlers/lifecycle.ts
    line: 103
    plan_ref: "T5.1 § Deep Dives — 'supersededBy apontando para skill inexistente ou para si mesma → erro tipado'"
    domain_anchor: "rules/error-handling.md § 3 — validar na entrada, falhar claro"
    summary: >
      A ordem das validações produz o status errado no cruzamento dos dois casos: a existência da
      SUCESSORA é verificada antes da existência da skill ALVO. Um `PUT /v1/skills/inexistente/lifecycle`
      com `superseded_by` também inexistente responde `400 successor skill not found` em vez de
      `404 not_found` — o cliente corrige o campo errado. `400` (em vez de `404`/`422`) para um
      recurso referenciado no corpo é defensável e consistente com o resto da API; o problema aqui
      é só a precedência.
    evidence: |
      lifecycle.ts:96-105   # checa a sucessora …
        if (sucessora.length === 0) return c.json({ error:'invalid_request', field:'superseded_by', … }, 400);
      lifecycle.ts:107-126  # … e só DEPOIS descobre que a própria skill não existe
        if (res.length === 0) return c.json({ error: 'not_found' }, 404);
    recommended_action: >
      Verificar a existência da skill alvo (no workspace do ator) antes de validar `superseded_by`,
      ou emitir 404 quando ambos falharem. Uma linha de ordem, sem custo de consulta adicional se
      reaproveitada no `update … returning`.

  - id: F-dom-6
