      é recusado com `successor skill not found`, uma mensagem que afirma inexistência sobre algo que
      o consumidor consegue resolver e carregar. Pode ser deliberado, mas não está registrado em
      nenhum ADR nem comentário.
    evidence: |
      lifecycle.ts:96-100
