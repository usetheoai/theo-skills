    summary: >
      Nenhum contrato de LEITURA devolve `lifecycle`, `deprecation_reason` ou `superseded_by`.
      `SkillView` (a forma de GET /v1/skills e GET /v1/skills/:id) não declara os campos, `toView()`
      não os mapeia, `liveColumns` não os seleciona, e os itens de `:retrieve` também não os
      carregam. O único lugar onde os três aparecem numa resposta é o eco do próprio PUT — que só
      quem acabou de escrever recebe. A Coverage Matrix declara o item 6 coberto por T5.1; medido,
      T5.1 entregou apenas a rota de ESCRITA.
    evidence: |
      # SkillView — 19 campos, nenhum de ciclo de vida (skills-store.ts:9-32)
      export interface SkillView {
        readonly skill_id: string; readonly name: string; readonly description: string;
        readonly state: string; readonly latest_revision_id: string | null;
        readonly category?: string; readonly execution?: string;
        readonly visibility: string; readonly embedded: boolean;
        readonly create_time: string; readonly update_time: string;
      }   # <-- sem lifecycle / deprecation_reason / superseded_by

