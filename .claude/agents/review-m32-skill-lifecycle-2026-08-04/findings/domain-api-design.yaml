    plan_ref: "T5.1 § Deep Dives — 'Negative case: sem escopo de escrita → 403 com o texto do serviço nomeando o escopo'"
    domain_anchor: "CLAUDE.md (theo-skills) § 'Mensagem de erro escrita para o terminal' — code estável + message legível por um humano que não sabe que existe CLI"
    summary: >
      O 403 da rota nova é `{ error: 'forbidden' }` e nada mais. O plano pedia explicitamente que o
      403 nomeasse o requisito, e o operador que recebe este corpo não distingue três causas
      diferentes: não é membro do workspace, é membro mas não é `admin`, ou usa uma credencial de
      workspace sem `userId`. Nenhum teste de integração da fase cobre o 403, então a lacuna não
      aparece como falha.
    evidence: |
      require-role.ts:32  if (principal.userId === null) return c.json({ error: 'forbidden' }, 403);
      require-role.ts:35  if (role === null || !roleSatisfies(role, min)) return c.json({ error: 'forbidden' }, 403);

      # asserções do teste do endpoint (m32-lifecycle-endpoint.integration.test.ts)
      $ grep -n "expect(res.status" …/m32-lifecycle-endpoint.integration.test.ts
      65:  expect(res.status).toBe(200);
      127: expect(res.status).toBe(400);
      # nenhum 403, nenhum 404, nenhuma asserção sobre `field`
    recommended_action: >
      Acrescentar `required_role: 'admin'` (e uma `message` legível) ao corpo do 403 emitido por
