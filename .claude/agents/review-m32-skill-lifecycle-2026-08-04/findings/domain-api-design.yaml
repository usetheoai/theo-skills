  - id: F-dom-7
    severity: LOW
    file: packages/core/src/contract/index.ts
    line: 112
    plan_ref: "T4.1 — três flags de opt-in"
    domain_anchor: "rules/architecture.md § validação na fronteira; rules/testing.md § 4.1 (edge vs negative case)"
    summary: >
      O enum `['true','false','1','0']` é a escolha certa contra a armadilha do `z.coerce.boolean()`
      (documentada no próprio comentário), mas recusa com 400 dois casos que clientes produzem sem
      querer: a flag **sem valor** (`?include_draft`, que o Hono entrega como `''`) e variações de
      caixa (`True`, `TRUE`). Nenhum é 'lixo' no sentido do comentário — são formas comuns de
      montar query string, e o consumidor recebe 400 numa flag que ele acreditava estar ligando.
      É estritude legítima, mas não documentada e não coberta por teste negativo nomeando a forma
      recusada.
    evidence: |
      contract/index.ts:112-115
        const BooleanFlagSchema = z.enum(['true','false','1','0']).optional()
          .transform((v) => v === 'true' || v === '1');
      # `?include_draft`      -> c.req.query() devolve ''  -> '' ∉ enum -> 400
      # `?include_draft=True` -> 'True' ∉ enum             -> 400
    recommended_action: >
      Aceitar `''` como `true` (semântica usual de flag presente) OU normalizar caixa antes do enum
      (`z.preprocess(v => String(v).toLowerCase(), …)`), e adicionar um teste negativo que asseve o
      400 e a forma exata do erro para um valor realmente inválido (`talvez`).

  - id: F-dom-8
    severity: INFO
    file: packages/api/src/server/handlers/lifecycle.ts
    line: 45
    plan_ref: "T5.1 — 'PUT /v1/skills/:id/lifecycle'"
    domain_anchor: "packages/api/src/server/handlers/visibility.ts:31 — PUT /v1/skills/:id/visibility (rota irmã de curadoria)"
    summary: >
      Resposta explícita à pergunta do escopo: **PUT é o verbo correto aqui, PATCH não seria**. A
      operação substitui o subrecurso `lifecycle` por INTEIRO — o corpo declara o estado final e os
      campos não enviados são limpos (`deprecationReason`/`supersededBy` viram `null` ao sair de
      `deprecated`), o que é semântica de substituição e é idempotente. PATCH sinalizaria merge
      parcial e induziria o consumidor a acreditar que omitir `superseded_by` preserva o valor
      anterior, quando ele é apagado. A escolha também é consistente com `PUT .../visibility`, que
      tem a mesma forma (subrecurso de curadoria, mesmo `requireRole('admin')`, mesmo 404 de
      não-enumeração). Sem defeito.
    evidence: |
      lifecycle.ts:110-120
        .set({ lifecycle: alvo,
               deprecationReason: deprecando ? reason : null,      # limpa -> substituição
               supersededBy: deprecando && supersededBy ? supersededBy : null,
               updateTime: new Date() })
      visibility.ts:31  app.put('/v1/skills/:id/visibility', adminOnly, …)   # mesma forma
    recommended_action: >
      Nenhuma. Manter PUT. Documentar no OpenAPI/README (quando existir) que campos omitidos são
      LIMPOS, não preservados — é a única armadilha de leitura do verbo.

