    recommended_action: >
      Acrescentar `lifecycle`, `deprecation_reason` e `superseded_by` a `SkillView`,
      a `liveColumns`/`toView()` e ao item de resultado de `:retrieve` (aditivos, `null`/ausente
      quando não deprecada), e propagar ao SDK/MCP/CLI. Enquanto isso não existir, a DoD #4 do M32
      não está satisfeita e a tela do M33 não terá o que renderizar — o item 6 da Coverage Matrix
      deve ser corrigido de 'coberto' para 'pendente' em vez de mantido como 6/6.

  - id: F-dom-2
    severity: HIGH
    file: CHANGELOG.md
    line: 13
    plan_ref: "Coverage Matrix #3 — 'opt-in entregue antes de o default mudar'; Risco #2 do M32 (severidade ALTA)"
    domain_anchor: "ROADMAP.md § M32 DoD bullet 3 — 'a mudança de comportamento é anunciada ANTES de virar default'; cycle-release.md § Bump-level derivation"
    summary: >
      A mudança de comportamento de `GET /v1/skills:retrieve` (o default deixa de devolver
      draft/deprecated/disabled) foi registrada sob `### Added`, não sob `### Changed`, e sem o
      prefixo `BREAKING:`. Como `cycle-release` deriva o bump exatamente dessas seções, esta
      entrega sai como **minor** — um consumidor que hoje recebe N resultados passará a receber
      menos, sem sinal de versão, sem deprecation notice e sem janela. A mitigação registrada no
      plano ('opt-in entregue junto') endereça a CAPACIDADE, não o AVISO: opt-in e novo default
      chegam no mesmo commit, então não houve o período de anúncio que a DoD exige.
    evidence: |
      CHANGELOG.md:13 (seção "### Added")
      - **theo-skills:** a busca esconde rascunho, descontinuada e desabilitada **por padrão**,
        com opt-in por eixo (`include_draft`, `include_deprecated`, `include_disabled`) …

      rules/cycle-release.md § Bump-level derivation:
        `minor` — `[Unreleased] § Added` is non-empty AND no major triggers.
        `major` — … any `[Unreleased] § Changed` entry begins with `BREAKING:`.
    recommended_action: >
      Mover a entrada para `### Changed` com prefixo `BREAKING:` (ou registrar um ADR que assuma
      explicitamente o risco e justifique o minor), e declarar no CHANGELOG a forma de restaurar o
      comportamento anterior (`include_draft=true&include_deprecated=true&include_disabled=true`).
      Se a intenção era realmente 'anunciar antes', o default seguro deveria vir num release
      posterior ao que entrega as flags.

  - id: F-dom-3
    severity: MEDIUM
    file: packages/api/src/server/handlers/lifecycle.ts
    line: 55
    plan_ref: "T5.1 — 'erro tipado'"
    domain_anchor: "CLAUDE.md (theo-skills) § 'erro tipado é contrato — code estável para a máquina decidir, message legível por um humano'; rules/error-handling.md § 2"
    summary: >
      O mesmo código de erro `invalid_request` carrega `details` com DOIS tipos diferentes na
      mesma API. Em `lifecycle.ts` (5 ocorrências) `details` é uma **string**; em `retrieve.ts:63`
      é o **objeto** `zod.flatten()`; em `visibility.ts:35` é string mas sem `field`. Um cliente
      que ramifica em `error === 'invalid_request'` não consegue tratar `details` uniformemente —
      terá de inspecionar o tipo em runtime, que é exatamente o 'mesmo dado em dois formatos'
      que o CLAUDE.md deste repositório aponta como defeito de backend que chega como defeito de
      tela.
    evidence: |
      lifecycle.ts:55   { error: 'invalid_request', field: 'lifecycle',      details: <string> }
      lifecycle.ts:77   { error: 'invalid_request', field: 'reason',         details: <string> }
      lifecycle.ts:103  { error: 'invalid_request', field: 'superseded_by',  details: <string> }
      retrieve.ts:63    { error: 'invalid_request',                          details: parsed.error.flatten() }  # objeto
      visibility.ts:35  { error: 'invalid_request',                          details: <string> }                # sem field
    recommended_action: >
      Fixar uma forma única para `invalid_request` — sugestão: `{ error, field, message }` com
      `message` sempre string e, quando houver múltiplos campos, `errors: [{field, message}]`.
      O `field` novo do lifecycle é a melhoria certa; falta retropropagá-lo a `visibility` e
      normalizar o `details` do `retrieve` (hoje o consumidor não recebe nome de campo utilizável).

  - id: F-dom-4
