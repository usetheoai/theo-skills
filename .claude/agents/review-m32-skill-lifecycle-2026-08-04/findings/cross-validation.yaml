      Nenhum checkbox do plano foi marcado [x] — nao ha reivindicacao falsa, ha lacuna de evidencia.
    recommended_action: Rodar a suite de integracao e o coverage (adicionando o script) e anexar a saida ao review; ou declarar explicitamente estes tres criterios como nao verificados no veredito.
