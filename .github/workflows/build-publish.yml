# Build + push da imagem, com gate de vulnerabilidade e assinatura keyless.
#
# ── POR QUE ESTE ARQUIVO É UMA CÓPIA (vendorizado) ───────────────────────────────────────
# O reusable canônico vive em `usetheodev/theo/.github/workflows/build-publish.yml`. O GitHub
# só compartilha reusable PRIVADO dentro do MESMO dono — chamar de outro repositório morre no
# PARSE (`workflow was not found`), sem sequer criar o job. Enquanto `theo` e `theo-skills`
# não estiverem sob o mesmo dono, a cópia é a única via.
#
# CAMINHO DE VOLTA (execute quando os dois repos estiverem sob `usetheoai`):
#   1. Em `publish.yml`, troque
#        uses: ./.github/workflows/build-publish.yml
#      por
#        uses: usetheoai/theo/.github/workflows/build-publish.yml@develop
#   2. APAGUE este arquivo.
#   3. `tests/workflows/gates.test.ts` trava as duas coisas no mesmo commit.
#
# Precedente: o theo-memory fez exatamente isto e documentou o mesmo caminho de volta.
name: build-publish (vendored)

on:
  workflow_call:
    inputs:
      image: { required: true, type: string }
      dockerfile: { required: false, type: string, default: 'Dockerfile' }
      context: { required: false, type: string, default: '.' }
      # Derivado do dono do repositório, NÃO fixado em texto. Uma transferência de conta para
      # organização troca o namespace do GHCR, e um valor fixo produziria 403 no push — o
      # runbook do umbrella lista essa cascata como um dos pontos que se esquece.
      registry: { required: false, type: string, default: '' }
      sign: { required: false, type: boolean, default: true }
      verify: { required: false, type: boolean, default: true }
      trivy: { required: false, type: boolean, default: true }
      platforms: { required: false, type: string, default: 'linux/amd64' }
    outputs:
      digest:
        description: 'Digest imutável (sha256:…) da imagem publicada.'
        value: ${{ jobs.build-publish.outputs.digest }}
      image_ref:
        description: 'Referência completa fixada por digest, pronta para deploy.'
        value: ${{ jobs.build-publish.outputs.image_ref }}

permissions:
  contents: read
  packages: write
  id-token: write # consumido só quando sign=true (cosign keyless); inócuo caso contrário

jobs:
  build-publish:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # TEM DE FICAR AQUI. O GitHub NÃO honra `timeout-minutes` num job `uses:`, então declará-lo
    # no chamador seria inerte. Sem ele, o default de 360 min vale.
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.ref.outputs.image_ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve registry (repo owner, lowercased)
        id: reg
        env:
          INPUT_REGISTRY: ${{ inputs.registry }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$INPUT_REGISTRY" ]; then
            echo "registry=$INPUT_REGISTRY" >> "$GITHUB_OUTPUT"
          else
            echo "registry=ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Docker meta (tags + labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ steps.reg.outputs.registry }}/${{ inputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build LOCAL para o scan. Sem push e sem login: usa base pública e cache do GHA.
      - name: Build for the scan (local load)
        if: ${{ inputs.trivy }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: ${{ inputs.image }}:scan-target
          cache-from: type=gha,scope=${{ inputs.image }}

      - name: Trivy (gate CRITICAL + HIGH)
        if: ${{ inputs.trivy }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ inputs.image }}:scan-target
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          # `ignore-unfixed`: uma CVE sem correção publicada não é acionável — travar o pipeline
          # nela treina o time a ignorar o gate.
          ignore-unfixed: true
          trivyignores: .trivyignore

      # SMOKE: a imagem SOBE? — o gate que faltava, e que custou 27h de indisponibilidade.
      #
      # Até aqui o pipeline publicava um artefato que NUNCA tinha sido executado. Trivy examina
      # o conteúdo; nada verificava que o processo levanta. Em 2026-08-02 o `theo-skills` ficou
      # fora do ar por 27h com a esteira inteira verde: `packages/api` importava `yazl`
      # declarado em `devDependencies`, o estágio `production-deps` roda `pnpm install --prod`,
      # e o symlink nunca foi criado. O pacote estava fisicamente na imagem, em
      # `/app/node_modules/.pnpm/yazl@3.3.1`, e mesmo assim não resolvia.
      #
      # POR QUE SEM DEPENDÊNCIA NENHUMA (sem Postgres, sem rede): medido nas duas imagens, a
      # quebrada e a corrigida. O grafo de módulos ESM é resolvido antes de qualquer validação
      # de ambiente, então a diferença aparece sem subir nada em volta:
      #
      #   quebrada  -> Error [ERR_MODULE_NOT_FOUND]: Cannot find package 'yazl'
      #   corrigida -> {"level":"error","msg":"THEOSKILL_PG_URI is required — refusing to start"}
      #
      # Uma recusa TIPADA por configuração faltante é sucesso aqui: prova que o binário
      # carregou, o grafo resolveu e o código chegou a rodar. Exigir Postgres para provar isso
      # acoplaria um construtor de imagem genérico ao banco de UM produto, por cobertura que
      # este passo já entrega.
      - name: Smoke — the image starts (packaging failure)
        if: ${{ inputs.trivy }}
        run: |
          set -o pipefail
          out=$(timeout 60 docker run --rm "${{ inputs.image }}:scan-target" 2>&1 | head -40 || true)
          echo "$out"
          if printf '%s' "$out" | grep -qE 'ERR_MODULE_NOT_FOUND|Cannot find (package|module)|ERR_DLOPEN_FAILED|MODULE_NOT_FOUND'; then
            echo "::error::A imagem nao levanta — dependencia ausente no artefato publicavel."
            echo "::error::Causa tipica: import de producao cujo pacote esta em devDependencies."
            echo "::error::Rode 'node scripts/check-declared-deps.mjs' para localizar."
            exit 1
          fi

      # O login vem DEPOIS do build-para-scan (lento a frio) para o token do GHCR estar FRESCO
      # na hora do push. Um build longo sobreviveria ao token pego no início do job, o buildkit
      # re-autenticaria anonimamente e o push levaria 403.
      - name: Login no GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image }}
          # `ignore-error`: o serviço de cache do GHA devolve 500/BlobNotFound de forma
          # intermitente. Cache é otimização, não insumo de correção — uma falha dele nunca
          # pode derrubar o build.
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ inputs.image }}

      - name: Instalar cosign
        if: ${{ inputs.sign }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Assinar por digest (keyless)
        if: ${{ inputs.sign }}
        run: cosign sign --yes "${{ steps.reg.outputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}"

      # GUARD DE CONFUSED-DEPUTY: aceita SOMENTE assinatura produzida por ESTE workflow, neste
      # repositório. A identidade keyless deriva de repo + path do workflow; um regexp frouxo
      # aqui aceitaria assinatura de outro workflow — exatamente o ataque que o guard barra.
      # `usetheo(dev|ai)` cobre a transferência de conta para organização sem quebrar a release.
      # Travado por `tests/workflows/gates.test.ts`.
      - name: Verificar a assinatura (identidade fixada)
        if: ${{ inputs.sign && inputs.verify }}
        run: |
          cosign verify "${{ steps.reg.outputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}" \
            --certificate-identity-regexp '^https://github\.com/usetheo(dev|ai)/theo-skills/\.github/workflows/build-publish\.yml@refs/(heads|tags)/.+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Export the immutable reference
        id: ref
        env:
          IMAGE_REF: ${{ steps.reg.outputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          {
            printf '## Imagem publicada\n\n'
            printf 'Referência fixada por digest — use ESTA no deploy, não a tag:\n\n'
            printf '    %s\n\n' "$IMAGE_REF"
            printf 'Tag e mutavel: develop de hoje nao e develop de amanha.\n'
            printf 'Fixar o digest é o que torna o deploy idempotente.\n'
          } >> "$GITHUB_STEP_SUMMARY"
