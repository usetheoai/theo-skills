# Gate rápido e SEM banco: build + lint + typecheck + testes.
#
# O DEFEITO QUE ISTO PREVINE: até M10 o repositório tinha ZERO workflows. 5.483 LoC, 32
# arquivos de teste e nenhuma verificação automática — a única barreira antes de `develop`
# era a leitura humana do diff.
#
# ESCOPO: aqui rodam os quatro gates genuinamente livres de I/O. O theo-memory exclui
# `pnpm test` do gate equivalente porque parte da suíte dele abre `Pool` real e vazaria
# ECONNREFUSED sem banco. AQUI ESSA RAZÃO NÃO EXISTE, e foi verificado antes de decidir:
# `packages/api/tests/contract/api.contract.test.ts:9` usa `fakePool = {} as unknown as Pool`
# — só o tipo. `pnpm test` roda verde sem banco em ~11s (74 + 46 + core). Copiar a exclusão
# do theo-memory teria sido cargo cult (ADR-M10-2 do plano).
name: CI

# GATILHOS: PR para `develop`/`main`, mais push em `develop`.
#
# POR QUE OS DOIS, e não um: o gate de PR mata o defeito antes de entrar no trunk; o de push
# pós-merge pega o que só existe DEPOIS do merge — dois PRs verdes isoladamente que se
# quebram juntos (conflito semântico). Escopos diferentes, não redundância.
on:
  # Invocado por publish.yml como gate encadeado, e disparado direto num PR.
  workflow_call:
  pull_request:
    branches: [develop, main]
  # SEM `paths-ignore` no PR, e isto é deliberado.
  #
  # Este job é um check EXIGIDO pela proteção de branch (desde 2026-08-01). `paths-ignore`
  # não pula o job: pula o WORKFLOW INTEIRO, então nenhum check é reportado — e um check
  # exigido que nunca reporta deixa o PR `BLOCKED` para sempre. Medido no PR #56, um PR só
  # de documentação: `develop` inalcançável até a filtragem sair daqui.
  #
  # A alternativa "esperta" — manter o filtro e pular por dentro com `if:` — tem uma falha
  # pior: condição errada reporta SUCCESS sem ter testado nada, e um portão verde sobre
  # mudança não testada é pior que minuto de runner gasto num README.
  #
  # `workspace` é a branch onde TODO trabalho nasce, e até 2026-08-03 ela não tinha portão
  # algum: o CI só rodava em PR e em push para `develop`. Consequência medida — 92 commits
  # acumulados sem lint, e três `async` sem `await` só apareceram no PR de promoção, onde
  # bloquearam um release. Descobrir na promoção é descobrir sob pressão.
  #
  # Só o gate SEM BANCO roda aqui. A suíte de integração continua exclusiva de PR e do
  # `schedule`: ela leva ~10 min e subir pgvector a cada push pagaria caro por um sinal que
  # o PR dá de qualquer forma. Este job é curto, e o par push/pull_request cai em grupos de
  # concorrência distintos (o evento está na chave), então nenhum cancela o outro.
  push:
    branches: [workspace]
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      - 'docs/**'
      - 'prototype/**'

  # SEM gatilho `push` para `develop` — deliberado desde 2026-08-03, e o oposto do que parece.
  #
  # `publish.yml` dispara em TODO push para `develop` (sem filtro de paths) e invoca este
  # arquivo por `workflow_call` no job `gate-ci`. O gatilho `push` daqui rodava o MESMO
  # trabalho no MESMO commit, e as duas instâncias caíam no mesmo grupo de concorrência —
  # `workflow_call` herda o contexto do chamador, então `event_name` é `push` e `ref_name` é
  # `develop` nas duas. `cancel-in-progress` matava uma, e o run `cancelled` ficava no SHA.
  #
  # Enquanto o check era informativo isso era cosmético — foi o que o comentário anterior
  # deste bloco afirmava ("consequência esperada, não defeito"). Desde que virou EXIGIDO, um
  # `cancelled` no contexto exigido BLOQUEIA o merge: aconteceu no v0.10.0 e de novo no PR
  # #118, verde em tudo e `BLOCKED`, liberado só por rerun manual. Pôr `github.workflow` na
  # chave separaria os grupos, mas ao custo de rodar tudo DUAS vezes por push. Remover o
  # gatilho redundante resolve sem esse custo: a cobertura não muda, porque o gatilho do
  # `publish` é um SUPERCONJUNTO deste (ele nem tem `paths-ignore`).

permissions:
  contents: read

concurrency:
  # Chaveado pela BRANCH, não por `github.ref`. Um push em develop e o PR do MESMO commit
  # carregam `github.ref` diferentes (`refs/heads/develop` vs `refs/pull/N/merge`), cairiam
  # em grupos distintos e AMBOS rodariam — o dobro do trabalho para o mesmo commit.
  #
  # NOTA HISTÓRICA (2026-08-03): este bloco dizia que o run `cancelled` em todo push para
  # `develop` era "consequência esperada, não defeito", e advertia contra corrigi-lo. Estava
  # certo enquanto o check era informativo e errado depois que virou EXIGIDO — um `cancelled`
  # no contexto exigido bloqueia o merge. A duplicação foi removida na raiz (ver o gatilho
  # `push`, retirado acima), então não há mais duas instâncias para cancelar.
  # O EVENTO ENTRA NA CHAVE, e isto deixou de ser detalhe em 2026-08-01.
  #
  # A chave era só a branch. Num PR de promocao `develop -> main`, `head.ref` vale `develop`
  # — a MESMA chave de um push em `develop`. Os dois caiam no mesmo grupo e um cancelava o
  # outro, e ambos reportam para o MESMO nome de check. Enquanto o check era informativo isso
  # era cosmetico (o proprio comentario daqui dizia "le-se como falha, nao e"). Desde que os
  # tres viraram EXIGIDOS pela protecao de branch, um run `cancelled` no contexto exigido
  # BLOQUEIA o merge — foi o que travou a release v0.10.0 ate o rerun manual.
  #
  # Com o evento na chave, push e pull_request nao se cancelam; dois pushes na mesma branch
  # (ou dois updates do mesmo PR) seguem se superpondo, que era a economia pretendida.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  static:
    name: build + lint + typecheck + test (sem banco)
    # Frota Blacksmith, adotada em 2026-07-30 junto com a transferência para a organização
    # `usetheoai`. As DUAS pré-condições foram verificadas por comando ANTES de aplicar a label:
    #   gh api repos/usetheoai/theo-skills --jq .owner.type   → "Organization"
    #   gh api orgs/usetheoai/installations                   → "blacksmith-sh" presente
    # Aplicar a label sem elas deixa o job `queued` para SEMPRE, sem erro algum — medido no
    # theo-traefik-mcp (>24h em fila). O sintoma não é uma falha; é silêncio.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # Folga sobre o observado (~1 min local). Muito abaixo do default de 360, que deixaria um
    # hang segurando a fila.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 11.1.0

      - name: Setup Node
        # Precisa casar o major do Dockerfile — testar num major diferente do que se publica
        # é como um worker morto chegar ao host de dev com a esteira verde. Travado por
        # `tests/workflows/gates.test.ts`.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build PRIMEIRO. Os pacotes consomem os `.d.ts` uns dos outros a partir de `dist/`;
      # num checkout limpo nada que precise de TIPOS resolve os aliases de workspace antes disto.
      #
      # O DEFEITO QUE ESTA ORDEM PREVINE (medido no theo-memory, run 30306550640): com `Lint`
      # antes do `Build`, as regras `@typescript-eslint/no-unsafe-*` — que são TYPE-AWARE —
      # acusaram 14 erros em código que ninguém havia tocado, porque sem `dist/` os imports
      # entre pacotes resolvem para `any`. Travado por `tests/workflows/gates.test.ts`.
      - name: Build
        run: pnpm run build

      # Roda ANTES do lint porque é mais barato e falha por uma causa mais específica: um
      # import de produção cujo pacote está em `devDependencies` passa build, lint, typecheck e
      # a suíte inteira — tudo com a árvore de desenvolvimento, onde ele existe — e só morre na
      # imagem, no boot. Foi assim que o serviço ficou 27h fora do ar com a esteira verde.
      - name: Dependências de produção declaradas
        run: node scripts/check-declared-deps.mjs

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Auto-verificação: a suíte que trava os invariantes destes próprios workflows.
      - name: Test — invariantes dos workflows
        run: pnpm run test:workflows
