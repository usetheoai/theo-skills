# Publica os QUATRO pacotes públicos no npm: `@usetheo/skills`, `-cli`, `-mcp` e `-sdk`.
#
# SÓ EM TAG, nunca em push de branch: um publish é irreversível — o npm não permite
# republicar uma versão, e `unpublish` tem janela de 72h e quebra quem já instalou. Publicar
# a cada push de `develop` transformaria cada commit numa versão que ninguém pode desfazer.
#
# ORDEM IMPORTA: o `core` sai primeiro. `cli`, `mcp` e `sdk` o declaram como dependência de
# produção, e publicá-los antes deixaria pacotes no registry cuja dependência não existe —
# instaláveis só até alguém tentar de fato.
#
# HISTÓRICO (issue #116): entre v0.8.0 e v0.11.2 este workflow falhou 8 de 8 execuções sem
# ninguém perceber, porque `secrets.NPM_TOKEN` não existia e o npm responde 404 — não 401 —
# a um publish não autorizado. O `E404` parecia "pacote não existe", e os quatro pacotes
# acabaram publicados à mão, sem provenance. Daí os dois portões abaixo: um recusa começar
# sem credencial, o outro recusa publicar artefato que não cumpre o próprio manifesto.
name: publish-npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # provenance do npm (attestation de que o build veio deste workflow)

jobs:
  publish:
    name: publica no npm
    # GitHub-hosted, e NÃO a frota Blacksmith que o resto do repo usa. Não é preferência:
    # o npm recusa provenance de runner que não seja dele. Medido na tag v0.11.3:
    #
    #   [E422] Error verifying sigstore provenance bundle: Unsupported GitHub Actions
    #   runner environment: "self-hosted". Only "github-hosted" runners are supported
    #   when publishing with provenance.
    #
    # A attestation deriva da identidade OIDC do runner, e a Blacksmith se apresenta como
    # `self-hosted` — o npm não tem como atestar o que não controla. As alternativas eram
    # perder a provenance (que é metade do motivo deste workflow existir, ver #116) ou
    # mover só ESTE job. O job é curto — instalar, buildar e publicar — então o custo do
    # runner GitHub é desprezível perto de publicar sem cadeia de custódia.
    runs-on: ubuntu-latest
    # Teto explícito: o default do GitHub é 360 min, e um publish pendurado seguraria um
    # runner por seis horas. O invariante que exige isto foi escrito no M10 — e este
    # workflow o violou, provando que o gate serve para quem o escreveu também.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Falha ANTES de qualquer publish quando não há credencial. Sem este passo a ausência
      # do secret chega ao registry como `E404 Not Found`, que se lê como "o pacote não
      # existe" — foi o disfarce que sustentou oito falhas seguidas (#116).
      - name: exige credencial de publicação
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::secrets.NPM_TOKEN ausente neste repositorio."
            echo "Sem ele o npm responde 404 (nao 401) e a falha se disfarca de 'pacote inexistente'."
            echo "Configure com: gh secret set NPM_TOKEN -R usetheoai/theo-skills"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # Build ANTES do publish: `files: ["dist"]` publica o compilado, e publicar sem build
      # produziria um pacote vazio — que instala sem erro e falha no primeiro import.
      - run: pnpm -r build

      # Recusa publicar um pacote que promete no manifesto um arquivo que o tarball não
      # entrega. Substitui os dois `test -f` anteriores, que checavam só a presença do JS de
      # dois pacotes — e por isso deixaram passar `sdk` e `mcp` com `types` apontando para um
      # `.d.ts` que o build nunca emitiu (#115).
      - name: portão de artefato — manifesto vs tarball
        run: node scripts/check-publish-artifacts.mjs

      # Recusa publicar uma SUPERFÍCIE que ninguém aprovou. O portão acima olha quais ARQUIVOS
      # chegam ao consumidor; este olha quais NOMES e quais CAMPOS. Sem ele, renomear um export
      # sobe como patch e quebra o `tsc` de quem está no `^x.y` — e o npm não permite unpublish
      # depois de 72h. Roda DEPOIS do build porque o nível de campo lê os `.d.ts` emitidos.
      - name: API surface gate — published names and fields
        run: pnpm run test:repo

      # `--no-git-checks` porque o publish roda a partir da tag, com a árvore limpa que o
      # checkout produziu; o pnpm reclamaria de HEAD destacado sem isso.
      - name: publica @usetheo/skills
        run: pnpm --filter @usetheo/skills publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: publica @usetheo/skills-cli
        run: pnpm --filter @usetheo/skills-cli publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: publica @usetheo/skills-mcp
        run: pnpm --filter @usetheo/skills-mcp publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: publica @usetheo/skills-sdk
        run: pnpm --filter @usetheo/skills-sdk publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: prova que `npx` funciona a partir do registry
        # Sem esta verificação, "publicado" significaria apenas "o comando saiu 0" — e um
        # pacote com `files` errado publica com sucesso e não executa.
        run: |
          sleep 30   # propagação do registry
          npx --yes @usetheo/skills-cli@latest --help

      - name: prova que os tipos chegam ao consumidor
        # O portão de artefato acima olha o tarball ANTES do publish. Este olha o que o
        # registry de fato serve — e é o defeito do #115 medido do lado de fora: o pacote
        # instalava e importava em JavaScript, e só quebrava no `tsc` de quem consome.
        run: |
          for pkg in @usetheo/skills @usetheo/skills-mcp @usetheo/skills-sdk; do
            # `npm pack --silent` imprime o nome do tarball que baixou — sem depender de `ls`.
            tarball=$(npm pack "$pkg@latest" --silent)
            count=$(tar tzf "$tarball" | grep -c '\.d\.ts$' || true)
            echo "$pkg -> $count arquivos .d.ts"
            [ "$count" -gt 0 ] || { echo "::error::$pkg publicado sem tipos"; exit 1; }
            rm -f "$tarball"
          done
