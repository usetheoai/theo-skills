# Publica a imagem — SOMENTE atrás dos gates, e nunca em pull request.
#
# POR QUE NÃO RODA EM PR: o reusable de build SEMPRE dá push da imagem; não existe modo
# build-only. Rodar em PR publicaria artefato de código não mergeado. Travado por
# `tests/workflows/gates.test.ts`.
#
# POR QUE OS GATES SÃO JOBS, e não confiança: `gate-ci` INVOCA o `ci.yml` neste commit. A
# alternativa — "o CI já rodou antes" — é falsa sempre que o push carrega mais de um commit,
# ou quando o CI foi pulado por `paths-ignore`.
name: publish

on:
  # Disparo manual — existe para PROVAR o gate, e a prova é o motivo dele.
  #
  # O gate de integração só demonstra que veta num run em que ele REPROVA e o job da imagem
  # fica `skipped`. A ordem dos jobs num run verde não prova veto algum — foi a recusa
  # correta do live-test em 2026-08-01. Sem disparo manual, produzir esse run exigiria
  # quebrar `develop` de propósito, e é dela que o ambiente de desenvolvimento se serve.
  #
  # O poder que ele concede — publicar a imagem — é o mesmo de quem já pode mergear em
  # `develop`, então não amplia a superfície.
  workflow_dispatch:
  push:
    branches: [develop]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false # nunca cancelar um push de imagem no meio

jobs:
  # Guarda: uma TAG só publica se o commit dela estiver em `main`. Uma tag criada numa branch
  # qualquer publicaria uma "release" que nunca passou pelo gate de release.
  guard-release-on-main:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Does the tag point at a commit contained in main?
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::A tag $GITHUB_REF_NAME nao esta contida em main — release invalida."
            exit 1
          fi

  gate-ci:
    needs: [guard-release-on-main]
    # `always()` + checagem de resultado: o guard só roda em tag; num push de develop ele é
    # `skipped`, e sem isto o gate inteiro seria pulado junto.
    if: ${{ always() && (needs.guard-release-on-main.result == 'success' || needs.guard-release-on-main.result == 'skipped') }}
    uses: ./.github/workflows/ci.yml

  # GATE DE INTEGRAÇÃO — com Postgres de verdade.
  #
  # `gate-ci` roda build+lint+typecheck+test SEM BANCO. Sozinho, ele não vê regressão de
  # integração; e enquanto a suíte pulava 240 testes em silêncio saindo 0, o portão inteiro
  # era decorativo. A forma vem do `theo-lens`, cujo gate de contrato reprovou um publish de
  # verdade em 2026-08-01 18:11, com `image: skipped`.
  gate-integration:
    needs: [guard-release-on-main]
    permissions:
      contents: read
    # A MESMA condição do `gate-ci`, e ela não é opcional: `guard-release-on-main` só roda em
    # tag, e um job cujo `needs` foi PULADO é pulado junto. Medido no run 30712454039 — a
    # primeira versão desta correção declarou o `needs` sem o `if`, e o gate apareceu como
    # `skipped` num publish que mesmo assim publicou a imagem. A correção parecia feita: o
    # teste passava, a dependência estava lá, e o portão não rodava.
    if: ${{ always() && (needs.guard-release-on-main.result == 'success' || needs.guard-release-on-main.result == 'skipped') }}
    uses: ./.github/workflows/integration.yml

  image:
    needs: [gate-ci, gate-integration]
    # `if` EXPLÍCITO, e não o default `success()`.
    #
    # O DEFEITO QUE ISTO CORRIGE (run 30572539211): num push de `develop` o
    # `guard-release-on-main` é `skipped` (ele só roda em tag). O GitHub propaga o skip pela
    # CADEIA de `needs`, então este job ficava `skipped` mesmo com o `gate-ci` verde — a
    # imagem NUNCA era publicada, e o workflow reportava `success`. Um pipeline que passa sem
    # produzir o artefato é pior que um que falha: ninguém vai investigar o verde.
    #
    # O PREÇO DE `always()`, e ele me pegou: com `always()` o `needs` PARA DE VETAR. O job
    # roda mesmo com dependência falha, e o único veto passa a ser o `result` checado aqui.
    # Eu declarei `needs: [gate-ci, gate-integration]` e checava só o `gate-ci` — o gate de
    # integração existia no grafo, aparecia verde no run, e NÃO impedia a imagem de subir com
    # a integração vermelha. É a mesma classe que este arquivo inteiro documenta: uma camada
    # afirmando sucesso sobre a falha da anterior — desta vez dentro do próprio gate.
    #
    # CADA gate declarado em `needs` precisa ser vetado à mão, aqui. `tests/workflows/gates.test.ts`
    # trava isso: acrescentar um `needs` sem o veto correspondente deixa a suíte vermelha.
    if: ${{ always() && needs.gate-ci.result == 'success' && needs.gate-integration.result == 'success' }}
    uses: ./.github/workflows/build-publish.yml
    with:
      image: theo-skills
      dockerfile: Dockerfile
      sign: true
      verify: true
      trivy: true
