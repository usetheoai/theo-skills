# Valida os próprios workflows + shellcheck dos blocos `run:`.
#
# Sem este gate, um erro de sintaxe em workflow só aparece quando o workflow roda — e um
# `run:` com bug de shell só aparece em produção do pipeline.
name: actionlint

on:
  pull_request:
    branches: [develop, main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  push:
    branches: [develop]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'

permissions:
  contents: read

concurrency:
  # O EVENTO ENTRA NA CHAVE — mesma correção que `ci`/`integration`/`sast` receberam em
  # 2026-08-01, e que este arquivo não recebeu por não ser check EXIGIDO.
  #
  # Num PR de promoção `develop → main`, `head.ref` vale `develop` — a MESMA chave de um push
  # em `develop`. Os dois caem no mesmo grupo, um cancela o outro, e o run `cancelled` fica no
  # SHA. Aqui isso não bloqueia merge (o check não é exigido), mas continua se lendo como
  # falha na lista de runs — e foi por parecer inofensivo que a versão exigida do mesmo
  # defeito sobreviveu até bloquear o v0.10.0 e o PR #118. Medido no PR #120.
  group: actionlint-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # O scan leva segundos; a folga cobre o pull da imagem num runner frio.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: actionlint (workflows + shellcheck dos blocos run:)
        # Imagem fixada por DIGEST — o repo pina actions por SHA; um `:latest` num gate de
        # qualidade/segurança é a mesma classe de risco de supply chain.
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color
